name: Create Tag

env:
  NODE_VERSION: 22.x

on:
  push:
    branches:
      - main

jobs:
  # =====================
  # Job 1: 自动化语义化版本发布（生成版本号、打 tag、更新 CHANGELOG）
  # =====================
  release:
    name: 🚀 Semantic 版本发布
    runs-on: ubuntu-24.04

    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    # 跳过 CI 的提交
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
      current_tag: ${{ steps.release.outputs.current_tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      changelog_preview: ${{ steps.release.outputs.changelog_preview }}

    steps:
      - name: 🔍 1. 拉取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⚙️ 2. 设置 pnpm
        uses: pnpm/action-setup@v6

      - name: ⚙️ 3. 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📦 4. 安装依赖
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "  [4/6] 📦 安装依赖（pnpm workspace）"
          echo "╚══════════════════════════════════════════╝"

          pnpm install --frozen-lockfile

          echo "✅ [4/6] 依赖安装完成"

      - name: 📢 5. 执行 semantic-release
        id: release
        env:
          # 使用 GitHub Actions 自动生成的 token，避免自定义 token 失效
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "  [5/6] 📢 执行 semantic-release"
          echo "╚══════════════════════════════════════════╝"

          set +e
          OUTPUT=$(pnpm exec semantic-release --debug 2>&1)
          EXIT_CODE=$?
          set -e

          echo "──────────────────────────────────────────"
          echo "  📋 [5/6] semantic-release 执行结果"
          echo "──────────────────────────────────────────"
          printf '%s\n' "$OUTPUT"
          echo "──────────────────────────────────────────"

          # 认证、权限或其他 semantic-release 错误必须直接让 Job 失败。
          # 不能把失败误报为“无需发布新版本”。
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::semantic-release 执行失败，退出码：$EXIT_CODE"
            exit "$EXIT_CODE"
          fi

          # 检查是否发布了新版本
          if grep -q "Published release" <<< "$OUTPUT"; then
            echo "✅ [5/6] 检测到新版本已发布"

            # 提取新版本号，兼容 semantic-release 的不同日志格式
            NEW_VERSION=$(
              printf '%s\n' "$OUTPUT" |
                sed -nE \
                  -e 's/.*The next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
                  -e 's/.*Published release ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' |
                head -n 1
            )

            if [ -z "$NEW_VERSION" ]; then
              echo "::error::无法从 semantic-release 输出中提取新版本号"
              exit 1
            fi

            # 获取上一个版本 Tag
            PREVIOUS_TAG=$(
              git tag -l 'v*' --sort=-version:refname |
                grep -v "^v${NEW_VERSION}$" |
                head -n 1 || true
            )

            # 设置输出变量
            {
              echo "new_release_published=true"
              echo "new_release_version=$NEW_VERSION"
              echo "current_tag=v$NEW_VERSION"
              echo "previous_tag=$PREVIOUS_TAG"
            } >> "$GITHUB_OUTPUT"

            # 提取 CHANGELOG 预览（最多前 5 行）
            if [ -f "CHANGELOG.md" ]; then
              PREVIEW=$(
                awk -v version="$NEW_VERSION" '
                  $0 ~ "^## \\[v?" version "\\]" {
                    found = 1
                    count = 0
                  }

                  found && count < 5 {
                    line = $0
                    gsub(/\047/, "\047\047", line)
                    printf "%s ", line
                    count++

                    if (count >= 5) {
                      exit
                    }
                  }
                ' CHANGELOG.md
              )

              echo "changelog_preview=$PREVIEW" >> "$GITHUB_OUTPUT"
            else
              echo "changelog_preview=" >> "$GITHUB_OUTPUT"
            fi
            echo "🎉 [5/6] 发布成功：v$NEW_VERSION"
          else
            echo "ℹ️ [5/6] 无需发布新版本（无符合规则的提交）"

            {
              echo "new_release_published=false"
              echo "new_release_version="
              echo "current_tag="
              echo "previous_tag="
              echo "changelog_preview="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 6. 自动触发 VSCode 插件发布
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.current_tag }}
        run: |
          echo "╭────────────────────────────────────────╮"
          echo "  [6/7] 🚀 自动触发 VSCode 插件发布"
          echo "╰────────────────────────────────────────╯"

          # GITHUB_TOKEN 创建的 Tag push 不会再触发其他工作流，
          # 因此在新 Tag 发布成功后，显式以该 Tag 作为 ref 调度发布工作流。
          gh workflow run RELEASE_VSCODE_EXTENSION.yml --ref "$RELEASE_TAG"

          echo "✅ [6/7] 已调度发布工作流：$RELEASE_TAG"

      - name: 🐞 7. 调试输出
        if: always()
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "  [7/7] 🐞 执行结果汇总"
          echo "╚══════════════════════════════════════════╝"
          echo "  👉 需要发布      : ${{ steps.release.outputs.new_release_published }}"
          echo "  👉 当前版本      : ${{ steps.release.outputs.new_release_version }}"
          echo "  👉 当前版本 Tag  : ${{ steps.release.outputs.current_tag }}"
          echo "  👉 上个版本 Tag  : ${{ steps.release.outputs.previous_tag }}"
          echo "  👉 日志预览      : ${{ steps.release.outputs.changelog_preview }}"
          echo "══════════════════════════════════════════"
